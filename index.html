<script src="columns/columns.js"></script>
<script>
(function(){
  var COLS = (window.MS_COLUMNS||[]).slice();
  var list=document.getElementById('list'), q=document.getElementById('q'), tagsEl=document.getElementById('tags');
  document.getElementById('yr').textContent=new Date().getFullYear();
  var activeTag=null;

  /* タグ一覧（出現回数の多い順） */
  var counts={}; COLS.forEach(function(c){ (c.tags||[]).forEach(function(t){ counts[t]=(counts[t]||0)+1; }); });
  Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).forEach(function(t){
    var b=document.createElement('button'); b.className='tag-btn'; b.type='button'; b.textContent='#'+t;
    b.addEventListener('click',function(){ activeTag=(activeTag===t?null:t); syncTags(); draw(); });
    b.dataset.tag=t; tagsEl.appendChild(b);
  });
  function syncTags(){ [].forEach.call(tagsEl.children,function(b){ b.classList.toggle('on', b.dataset.tag===activeTag); }); }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function draw(){
    var kw=(q.value||'').trim().toLowerCase();
    var rows=COLS.filter(function(c){
      if(activeTag && !(c.tags||[]).includes(activeTag)) return false;
      if(!kw) return true;
      var hay=(c.title+' '+(c.excerpt||'')+' '+(c.tags||[]).join(' ')).toLowerCase();
      return kw.split(/\s+/).every(function(w){ return hay.indexOf(w)>=0; });
    });
    if(!rows.length){ list.innerHTML='<div class="empty">該当するコラムが見つかりませんでした。</div>'; return; }
    list.innerHTML=rows.map(function(c){
      return '<a class="col-card" href="columns/'+encodeURIComponent(c.slug)+'.html">'
        +'<div class="cc-body">'
        +'<div class="cc-date">'+esc(c.date||'')+'</div>'
        +'<h2>'+esc(c.title)+'</h2>'
        +'<p class="cc-ex">'+esc(c.excerpt||'')+'</p>'
        +'<div class="cc-tags">'+(c.tags||[]).map(function(t){return '<span>#'+esc(t)+'</span>';}).join('')+'</div>'
        +'</div></a>';
    }).join('');
  }
  q.addEventListener('input',draw);
  draw();
})();
</script>
